solution: |-
  def longest_ones_iii(nums: List[int], k: int) -> int:
      left = 0
      zeros = 0
      best = 0

      for right, value in enumerate(nums):
          if value == 0:
              zeros += 1

          while zeros > k:
              if nums[left] == 0:
                  zeros -= 1
              left += 1

          best = max(best, right - left + 1)

      return best

id: 392
title: Is Subsequence
difficulty: Easy
matchmode: exact
function: is_subsequence
arguments:
- name: s
  type: str
- name: t
  type: str
return_type: bool
examples: 2
condition: |-
  <p>Given two strings <code>s</code> and <code>t</code>, return <code>true</code> if <code>s</code> is a <strong>subsequence</strong> of <code>t</code>, or <code>false</code> otherwise.</p>
  <p>A <strong>subsequence</strong> of a string is a new string that is formed from the original string by deleting some (can be none) of the characters without disturbing the relative positions of the remaining characters.</p>

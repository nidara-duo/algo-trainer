  output: ['-50', '-38', -36->-35, '-2', '2', '12', '22', '31']
solution: |-
  def summary_ranges(nums: List[int]) -> List[str]:
      if not nums:
          return []

      nums = sorted(set(nums))
      res = []
      start = nums[0]
      prev = nums[0]

      for i in range(1, len(nums)):
          if nums[i] == prev + 1:
              prev = nums[i]
          else:
              if start == prev:
                  res.append(str(start))
              else:
                  res.append(f"{start}->{prev}")
              start = nums[i]
              prev = nums[i]

      if start == prev:
          res.append(str(start))
      else:
          res.append(f"{start}->{prev}")

      return res

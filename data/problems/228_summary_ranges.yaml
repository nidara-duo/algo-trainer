id: 228
title: Summary Ranges
difficulty: Easy
matchmode: exact
function: summary_ranges
arguments:
- name: nums
  type: List[int]
return_type: List[str]
examples: 2
condition: |-
  <p>You are given a <strong>sorted unique</strong> integer array <code>nums</code>. Return <em>the <strong>smallest sorted list of ranges that cover all the numbers in the array exactly</strong></em>.</p>

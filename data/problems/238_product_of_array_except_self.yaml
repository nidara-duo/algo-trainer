solution: |-
  def product_except_self(nums: List[int]) -> List[int]:
      n = len(nums)
      ans = [1] * n

      left_prod = 1
      for i in range(n):
          ans[i] = left_prod
          left_prod *= nums[i]

      right_prod = 1
      for i in range(n - 1, -1, -1):
          ans[i] *= right_prod
          right_prod *= nums[i]

      return ans

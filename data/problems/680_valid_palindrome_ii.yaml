solution: |-
  def valid_palindrome_ii(s: str) -> bool:
      def check_palindrome(s, i, j):
          while i < j:
              if s[i] != s[j]:
                  return False
              i += 1
              j -= 1
          return True

      left, right = 0, len(s) - 1
      while left < right:
          if s[left] != s[right]:
              return check_palindrome(s, left + 1, right) or check_palindrome(s, left, right - 1)
          left += 1
          right -= 1

      return True

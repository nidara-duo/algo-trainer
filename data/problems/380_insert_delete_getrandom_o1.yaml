condition: |-
  <p>Implement the <code>RandomizedSet</code> class:</p>
  <ul>
    <li><code>RandomizedSet()</code> Initializes the <code>RandomizedSet</code> object.</li>
    <li><code>bool insert(int val)</code> Inserts an item <code>val</code> into the set and returns <code>true</code> if the item was not present, and <code>false</code> otherwise.</li>
    <li><code>bool remove(int val)</code> Removes an item <code>val</code> from the set and returns <code>true</code> if the item was present, and <code>false</code> otherwise.</li>
    <li><code>int getRandom()</code> Returns a random element from the current set of elements.</li>
  </ul>
  <p><strong>Note:</strong> This task requires implementing a class. The tests will create an instance and call methods on it.</p>

solution: |-
  def is_one_edit_distance(s: str, t: str) -> bool:
      if s == t:
          return False

      ls, lt = len(s), len(t)

      if ls > lt:
          s, t = t, s
          ls, lt = lt, ls

      if lt - ls > 1:
          return False

      edited = False
      j = 0

      for i in range(ls):
          if s[i] != t[j]:
              if edited:
                  return False
              edited = True

              if lt - ls:
                  j += 1
          j += 1

      return True

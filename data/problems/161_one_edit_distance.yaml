id: 161
title: One Edit Distance
difficulty: Medium
matchmode: exact
function: is_one_edit_distance
arguments:
- name: s
  type: str
- name: t
  type: str
return_type: bool
examples: 4
condition: |-
  <p>Given two strings <code>s</code> and <code>t</code>, return <code>true</code> if they are both one edit distance apart, otherwise return <code>false</code>.</p>
  <p>A string <code>s</code> is said to be one distance apart from a string <code>t</code> if you can:</p>
  <ul>
    <li>Insert exactly one character into <code>s</code> to get <code>t</code>.</li>
    <li>Delete exactly one character from <code>s</code> to get <code>t</code>.</li>
    <li>Replace exactly one character of <code>s</code> with a different character to get <code>t</code>.</li>
  </ul>

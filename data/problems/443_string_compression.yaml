  output: 8
- args: [[t, t, q, q, g, g, g, g, g, k, k, k, k]]
  output: 8
- args: [[z, z, z, z, z, d, d, d, b, b, o, o, o, h]]
  output: 9
- args: [[o, o, o, o, t, v, v]]
  output: 5
- args: [[i, i, s, s, s, j, j, y, y]]
  output: 8
- args: [[v, t, t, t, t, y, y, y]]
  output: 5
- args: [[s, s, k, k, k, k, q, q, q, q, q]]
  output: 6
- args: [[o, o, o, o, o, z, z, x, x, q, q, q, q, q, z, z]]
  output: 10
- args: [[s, f, f, f, j, j, j, d, d, d, o]]
  output: 8
- args: [[c, c, c, c, o, j, j, j, s, s]]
  output: 7
solution: |-
  def compress(chars: List[str]) -> int:
      write = 0
      read = 0

      while read < len(chars):
          char = chars[read]
          count = 0

          while read < len(chars) and chars[read] == char:
              read += 1
              count += 1

          chars[write] = char
          write += 1

          if count > 1:
              for digit in str(count):
                  chars[write] = digit
                  write += 1

      return write

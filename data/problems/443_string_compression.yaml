id: 443
title: String Compression
difficulty: Medium
matchmode: exact
function: compress
arguments:
- name: chars
  type: List[str]
return_type: int
examples: 3
condition: |-
  <p>Given an array of characters <code>chars</code>, compress it using the following algorithm: Begin with an empty string. For each group of consecutive repeating characters in <code>chars</code>, append the character followed by the count (if greater than 1).</p>

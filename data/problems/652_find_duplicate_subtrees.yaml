id: 652
title: Find Duplicate Subtrees
difficulty: Medium
matchmode: sorted
function: find_duplicate_subtrees
arguments:
- name: root
  type: Optional[TreeNode]
return_type: List[Optional[TreeNode]]
examples: 3
condition: |-
  <p>Given the <code>root</code> of a binary tree, return <strong>all duplicate subtrees</strong>.</p>
  <p>For each kind of duplicate subtrees, you only need to return the root node of <strong>any one</strong> of them.</p>
  <p>Two trees are duplicate if they have the <strong>same structure</strong> with the <strong>same node values</strong>.</p>

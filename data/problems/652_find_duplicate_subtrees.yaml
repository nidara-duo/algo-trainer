solution: |-
  def find_duplicate_subtrees(root: Optional[TreeNode]) -> List[Optional[TreeNode]]:
      from collections import defaultdict

      counts = defaultdict(int)
      res = []

      def traverse(node):
          if not node:
              return "#"

          struct = f"{node.val},{traverse(node.left)},{traverse(node.right)}"
          counts[struct] += 1

          if counts[struct] == 2:
              res.append(node)

          return struct

      traverse(root)
      return res

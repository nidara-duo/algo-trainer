id: 49
title: Group Anagrams
difficulty: Medium
matchmode: sorted
function: group_anagrams
arguments:
- name: strs
  type: List[str]
return_type: List[List[str]]
examples: 3
condition: |-
  <p>Given an array of strings <code>strs</code>, group the <strong>anagrams</strong> together. You can return the answer in any order.</p>
  <p>An anagram is a word or phrase formed by rearranging the letters of a different word or phrase, using all the original letters exactly once.</p>
tests:
- args: [[eat, tea, tan, ate, nat, bat]]
  output: [[bat], [nat, tan], [ate, eat, tea]]
- args: [['']]
  output: [['']]
- args: [[a]]
  output: [[a]]

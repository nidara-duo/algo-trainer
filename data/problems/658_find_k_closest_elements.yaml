solution: |-
  def find_closest_elements(arr: List[int], k: int, x: int) -> List[int]:
      left, right = 0, len(arr) - k

      while left < right:
          mid = (left + right) // 2
          # Сравниваем расстояние от начала окна и конца окна до x
          if x - arr[mid] > arr[mid + k] - x:
              left = mid + 1
          else:
              right = mid

      return arr[left:left + k]

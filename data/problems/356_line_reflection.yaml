solution: |-
  def is_reflected(points: List[List[int]]) -> bool:
      if not points:
          return True

      min_x = float('inf')
      max_x = float('-inf')
      point_set = set()

      for x, y in points:
          min_x = min(min_x, x)
          max_x = max(max_x, x)
          point_set.add((x, y))

      total_sum = min_x + max_x

      for x, y in points:
          if (total_sum - x, y) not in point_set:
              return False

      return True
